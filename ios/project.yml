name: BudakMiles
options:
  bundleIdPrefix: id.budakmiles
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: id
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  BudakMiles:
    type: application
    platform: iOS
    sources:
      - BudakMiles
    info:
      path: BudakMiles/Info.plist
      properties:
        CFBundleDisplayName: BUDAKMILES
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: id
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.budakmiles.app
        PRODUCT_NAME: BudakMiles
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  BudakMilesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BudakMilesTests
    dependencies:
      - target: BudakMiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.budakmiles.app.tests
        GENERATE_INFOPLIST_FILE: YES
  BudakMilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BudakMilesUITests
    dependencies:
      - target: BudakMiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.budakmiles.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BudakMiles
schemes:
  BudakMiles:
    build:
      targets:
        BudakMiles: all
        BudakMilesTests: [test]
        BudakMilesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BudakMilesTests
        - BudakMilesUITests
    archive:
      config: Release
