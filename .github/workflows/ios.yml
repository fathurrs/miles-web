name: iOS

on:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit and UI tests
        run: |
          xcodebuild test \
            -project BudakMiles.xcodeproj \
            -scheme BudakMiles \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO

      - name: Build simulator app
        run: ./scripts/build_simulator_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BudakMiles-simulator
          path: ios/build/BudakMiles-simulator.zip

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults
          path: ios/build/TestResults.xcresult
